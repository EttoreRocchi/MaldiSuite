name: Smoke test

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - README.md
      - index.html
      - 404.html
      - tools/smoke_test.py
      - .github/workflows/smoke.yml

jobs:
  quickstart:
    name: Quick start (${{ matrix.source }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        source: [repository, pypi]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install maldisuite from the repository
        if: matrix.source == 'repository'
        run: pip install .

      - name: Install maldisuite from PyPI
        if: matrix.source == 'pypi'
        run: pip install maldisuite

      - name: Run the README quick start on a synthetic cohort
        run: python tools/smoke_test.py

  links:
    name: Links in README and site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: MaldiSuite

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200..=299,403,429
            --root-dir ${{ github.workspace }}
            --exclude '^https://fonts\.(googleapis|gstatic)\.com/?$'
            MaldiSuite/README.md MaldiSuite/index.html MaldiSuite/404.html
